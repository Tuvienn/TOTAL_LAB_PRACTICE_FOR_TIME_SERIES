[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-practice-3-v2"
version = "0.1.0"
description = "End-to-end time-series forecasting workflow for Practice 3 v2"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
presentation = [
    "ipykernel>=7",
    "nbconvert>=7",
]
eda = [
    "matplotlib>=3.9",
]
modeling = [
    "scikit-learn>=1.7",
    "xgboost>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
