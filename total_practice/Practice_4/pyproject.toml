[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-4"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "numpy", "jsonschema", "matplotlib==3.11.2", "statsmodels==0.14.6", "tzdata==2026.5", "scikit-learn==1.9.1", "xgboost==3.4.1", "tensorflow==2.20.0", "keras==3.11.3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
