[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-4"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy",
    "scipy",
    "jsonschema",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "tzdata",
    "scikit-learn",
    "xgboost>=3.0",
    "torch",
    "shap",
    "holidays",
    "requests",
    "ipykernel",
    "nbconvert",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
