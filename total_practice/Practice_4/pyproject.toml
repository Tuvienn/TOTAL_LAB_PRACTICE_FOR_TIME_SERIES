[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-4"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "numpy", "jsonschema"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
