[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-practice-1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "nbconvert>=7,<8",
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"practice_1.visualization" = ["*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

